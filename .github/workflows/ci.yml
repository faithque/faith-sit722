name: CI/CD Pipeline

on:
  push:
    branches:
      - testing

jobs:
  ci-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      
      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.5.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version
      
      # --- Steps for customer_service ---
      - name: Set up Python for customer_service
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies for customer_service
        run: pip install -r requirements.txt
        working-directory: ./backend/customer_service

      - name: Run tests for customer_service
        run: python -m pytest
        working-directory: ./backend/customer_service

      # --- Steps for product_service ---
      - name: Set up Python for product_service
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies for product_service
        run: pip install -r requirements.txt
        working-directory: ./backend/product_service

      - name: Run tests for product_service
        run: python -m pytest
        working-directory: ./backend/product_service

      # --- Steps for order_service ---
      - name: Set up Python for order_service
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies for order_service
        run: pip install -r requirements.txt
        working-directory: ./backend/order_service

      - name: Run tests for order_service
        run: python -m pytest
        working-directory: ./backend/order_service

      - name: Build and test the app
        run: |
          docker-compose build --pull

      - name: Log in to Azure Container Registry
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          
      - name: Tag and push images to ACR
        if: success()
        run: |
          docker tag week10_customer_service:latest ${{ secrets.ACR }}/customer_service:latest
          docker tag week10_product_service:latest ${{ secrets.ACR }}/product_service:latest
          docker tag week10_order_service:latest ${{ secrets.ACR }}/order_service:latest
          docker tag week10_frontend:latest ${{ secrets.ACR }}/frontend:latest

          docker push ${{ secrets.ACR }}/product_service:latest
          docker push ${{ secrets.ACR }}/order_service:latest
          docker push ${{ secrets.ACR }}/frontend:latest
  
  cd-staging:
    needs: ci-build
    runs-on: ubuntu-latest
    
    steps:
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          
      - name: Create staging environment
        run: |
          # Use secrets for resource group and other dynamic values
          az group create --name ${{ secrets.STAGING_RESOURCE_GROUP }} --location ${{ secrets.AZURE_REGION }}
          az appservice plan create --name ${{ secrets.STAGING_PLAN }} --resource-group ${{ secrets.STAGING_RESOURCE_GROUP }} --sku B1
          az webapp create --name ${{ secrets.STAGING_APP }} --resource-group ${{ secrets.STAGING_RESOURCE_GROUP }} --plan ${{ secrets.STAGING_PLAN }}

      - name: Deploy image to staging
        run: |
          az webapp config container set --name ${{ secrets.STAGING_APP }} --resource-group ${{ secrets.STAGING_RESOURCE_GROUP }} \
            --docker-custom-image-name ${{ secrets.ACR }}/faithque/faith-sit722:latest \
            --docker-registry-server-url https://${{ secrets.ACR }} \
            --docker-registry-server-user ${{ secrets.AZURE_ACR_USERNAME }} \
            --docker-registry-server-password ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Destroy staging environment
        if: always()
        run: |
          # This step will always run to ensure cleanup.
          az group delete --name ${{ secrets.STAGING_RESOURCE_GROUP }} --yes --no-wait